<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F0E5DB"><title>CRATEFLOW — From Spotify to Beatport. In one flow.</title><meta name="description" content="Import Spotify playlists, automatically match music on Beatport and create your playlist in one flow."><link rel="stylesheet" href="/styles.css?v=20261118-app1"><link rel="stylesheet" href="/landing-agentflow-v1.css"><link rel="preconnect" href="https://use.typekit.net"><link rel="stylesheet" href="https://use.typekit.net/nxa5ott.css"><link rel="stylesheet" href="/app-theme-v2.css?v=20261120-playlist221"><link rel="stylesheet" href="/typography-neue-haas.css"><link rel="stylesheet" href="/copy-paste-v1.css"></head>
<body><div class="shell"><aside><button type="button" class="logo" data-page="landing" aria-label="CRATEFLOW Startseite">CRATEFLOW<span class="logo-mark">®</span><small>DJ MUSIC WORKSPACE</small></button><nav id="navigation"><button data-page="welcome">BEATPORT CONNECT</button><button data-page="overview" class="active">OVERVIEW</button><button data-page="import">IMPORT & SYNC</button><button data-page="library">LIBRARY</button><button data-page="beatport">BEATPORT</button><button data-page="mix">MIX COMPATIBILITY</button><button data-page="downloads">DOWNLOADS</button><button data-page="export">EXPORT</button><button data-page="settings">SETTINGS</button></nav><div class="sidebar-bottom" id="connection">Spotify nicht verbunden</div></aside><main><header><div id="crumb">WORKSPACE / OVERVIEW</div><div class="user">IN YOUR ELEMENT <span class="header-asterisk">✳</span></div></header><section id="view"></section><div id="playlist-editor-status" class="playlist-sr-only" role="status" aria-atomic="true"></div></main></div><div id="toast"></div><input id="csv" type="file" accept=".csv,text/csv" hidden><input id="restore" type="file" accept=".json" hidden>
<dialog class="studio-dialog" id="studioPlaylistDialog" aria-labelledby="studioDialogTitle">
  <form id="studioPlaylistForm">
    <button type="button" class="studio-close" id="studioClose" aria-label="Close">×</button>
    <h2 id="studioDialogTitle">Create Beatport Playlist</h2>
    <label class="label" for="studioPlaylistTitle">Playlist title</label>
    <input class="field" id="studioPlaylistTitle" maxlength="75" required autofocus>
    <p class="dialog-status" id="studioDialogStatus" role="status" tabindex="-1"></p>
    <div class="row studio-dialog-actions">
      <button type="button" class="btn" id="studioCancel">Cancel</button>
      <button type="submit" class="btn primary" id="studioCreatePlaylist">Create Playlist</button>
    </div>
  </form>
</dialog>
<dialog class="studio-dialog" id="playlistManager" aria-labelledby="playlistManagerTitle" aria-describedby="playlistManagerDescription">
  <form id="playlistManagerForm">
    <h2 id="playlistManagerTitle">Playlist</h2>
    <p id="playlistManagerDescription"></p>
    <div id="playlistManagerNameGroup">
      <label class="label" for="playlistManagerName">Playlist name</label>
      <input id="playlistManagerName" class="field" aria-describedby="playlistManagerError">
    </div>
    <p class="dialog-status" id="playlistManagerError" role="alert"></p>
    <div class="row studio-dialog-actions">
      <button type="button" class="btn" id="playlistManagerCancel">Cancel</button>
      <button type="submit" class="btn primary" id="playlistManagerSubmit">Save</button>
    </div>
  </form>
</dialog>
<script src="/clipboard-import.js?v=20261119-v1" defer></script><script src="/matching.js?v=20261118-v1" defer></script><script src="/mix-compatibility.js?v=20261119-v1" defer></script><script src="/beatport-export.js?v=20261120-v1" defer></script><script src="/lib/playlist-model.js?v=20261120-v3" defer></script><script src="/lib/playlist-editor.js?v=20261120-v1" defer></script><script src="/app.js?v=20261120-playlist221" defer></script></body></html>
